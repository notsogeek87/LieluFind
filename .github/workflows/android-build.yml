name: Android build

# Pas de trigger pull_request : chaque push est déjà buildé, sinon push + PR
# lançaient deux builds identiques.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.MD"
      - "fastlane/**"
      - "distribution/**"
  workflow_dispatch:

permissions:
  contents: write

# Un seul build à la fois par branche. Sur main on n'annule jamais : chaque push
# garde sa release versionnée, ils passent l'un après l'autre.
concurrency:
  group: android-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # flutter-version-file ne sait lire que pubspec.yaml/.fvmrc : sur ce fichier texte,
      # l'action prenait silencieusement la dernière stable. On passe la version explicitement.
      - name: Lire .flutter-version
        id: flutter_version
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter (version de .flutter-version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: Vérifier la version de Flutter
        env:
          EXPECTED: ${{ steps.flutter_version.outputs.version }}
        run: |
          ACTUAL=$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')
          echo "Flutter $ACTUAL (attendu $EXPECTED)"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::Flutter $ACTUAL au lieu de $EXPECTED"; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Écrire android/local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          FLUTTER_SDK="${FLUTTER_HOME:-$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")}"
          {
            echo "sdk.dir=${SDK_DIR}"
            echo "flutter.sdk=${FLUTTER_SDK}"
          } > android/local.properties

      - name: Installer NDK et CMake
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
          printf '\nandroid.ndkVersion=27.0.12077973\n' >> android/gradle.properties

      # Variante FOSS : sans services Google.
      - name: Passer le pubspec en FOSS
        run: |
          cp pubspec-foss.yaml pubspec.yaml
          cp pubspec-foss.lock pubspec.lock

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'build.yaml', 'lib/**/*.dart') }}
          restore-keys: build-runner-${{ runner.os }}-

      - name: Générer le code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyse statique
        run: flutter analyze

      # Migrations de la base : chaque version de schéma doit migrer vers les suivantes.
      - name: Tests (fonctionnalités, migrations de base)
        run: flutter test test/features test/drift

      # Un changement de tables sans nouvelle version de schéma (ou sans snapshot
      # drift_schemas/) régénère ces fichiers : le diff fait échouer le build.
      - name: Schéma de base à jour
        run: |
          dart run drift_dev make-migrations
          git diff --exit-code -- drift_schemas test/drift lib/core/data/drift/database/sqlite_client.steps.dart

      # main : clé de release secrète (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Sans elle, le build de main échoue : une release
      # signée avec une clé publique pourrait être imitée par n'importe qui.
      # Autres branches : clé de debug committée (android/ci-debug.p12), APK de test seulement.
      - name: Configurer la signature
        env:
          IS_MAIN: ${{ github.ref_name == 'main' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.p12
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=../release.p12"
            } > android/keystore.properties
            echo "Signature : clé de release."
          elif [ "$IS_MAIN" = "true" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent : impossible de signer la release de main."
            exit 1
          else
            printf '%s\n' storePassword=android keyPassword=android \
              keyAlias=androiddebugkey storeFile=../ci-debug.p12 > android/keystore.properties
            echo "Signature : clé de debug committée (APK de test)."
          fi

      # versionCode = run_number (strictement croissant), versionName = version du pubspec,
      # tag de release v<version>.<run_number>.
      - name: Déterminer la version
        id: version
        run: |
          BASE=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK FOSS (release)
        run: |
          flutter build apk --release --flavor foss \
            --target-platform android-arm64 \
            --build-name=${{ steps.version.outputs.base }} \
            --build-number=${{ github.run_number }}

      - name: Renommer l'APK avec sa version
        id: apk
        run: |
          NAME="LieluFind-${{ steps.version.outputs.name }}.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-foss-release.apk "dist/$NAME"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lielufind-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Vraie release permanente pour chaque push sur main (ou lancement manuel sur main).
      - name: Publier la release GitHub (main)
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          cat > release-notes.md <<'NOTES'
          ## Installer LieluFind

          1. Télécharge l'APK `${{ steps.apk.outputs.name }}` ci-dessous (section « Assets »).
          2. Ouvre-le. Si Android bloque l'installation, autorise la source (navigateur ou gestionnaire de fichiers) à installer des applications inconnues.
          3. Touche « Installer ».

          Tous les APK ont la même clé de signature : une nouvelle version s'installe par-dessus l'ancienne, tes réglages sont conservés. L'app vérifie l'empreinte SHA-256 et la signature de chaque mise à jour avant de l'installer.

          ---
          Run #${{ github.run_number }} (${{ github.sha }}). Signé avec la clé de release LieluFind.
          NOTES
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "LieluFind $TAG" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"

      # Autres branches / PR : un tag de pré-release par branche, remplacé à chaque build.
      - name: Déterminer le tag de release debug
        id: reltag
        if: "!(github.event_name != 'pull_request' && github.ref_name == 'main')"
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="$HEAD_BRANCH"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
          echo "tag=debug-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK de test en pré-release
        if: "!(github.event_name != 'pull_request' && github.ref_name == 'main')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ steps.reltag.outputs.tag }}
          REL_BRANCH: ${{ steps.reltag.outputs.branch }}
        run: |
          TAG="$REL_TAG"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "LieluFind — APK de test ($REL_BRANCH)" \
            --notes "Build de test de la branche. Run #${{ github.run_number }} (${{ github.sha }})." \
            --prerelease \
            --target "${{ github.sha }}"
